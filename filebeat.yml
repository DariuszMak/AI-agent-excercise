filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata: ~
      - decode_json_fields:
          fields: ["log"]
          overwrite_keys: true

  - type: filestream
    id: windows-host-app
    paths:
      - /var/log/host_app/*.log
    prospector.scanner.check_interval: 2s
    processors:
      - decode_json_fields:
          fields: ["message"]
          overwrite_keys: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]

setup.kibana:
  host: "kibana:5601"
